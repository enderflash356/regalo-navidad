<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>El Cielo Que Lo Vio Todo - Touch Joystick</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: 'Inter', sans-serif; color: #f8fafc; }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        /* AVISO DE ROTACIÓN MÓVIL */
        #rotate-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020617; z-index: 999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px;
        }
        #rotate-warning h2 { color: #f43f5e; margin-bottom: 15px; font-size: 1.4rem; }
        #rotate-warning p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; max-width: 320px; }
        .rotate-icon { font-size: 3.5rem; margin-bottom: 15px; animation: rotatePhone 2s infinite ease-in-out; }
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (max-width: 900px) and (orientation: portrait) {
            #rotate-warning { display: flex; }
        }

        /* JOYSTICK TÁCTIL VIRTUAL PARA MÓVIL */
        #joystick-zone {
            position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(244, 63, 94, 0.4);
            border-radius: 50%; z-index: 15; backdrop-filter: blur(4px); touch-action: none;
            display: flex; justify-content: center; align-items: center;
        }
        #joystick-knob {
            width: 45px; height: 45px; background: rgba(244, 63, 94, 0.7);
            border-radius: 50%; box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
            position: absolute; pointer-events: none; transition: transform 0.05s ease-out;
        }

        /* Ocultar Joystick en PC si no hay soporte táctil */
        @media (pointer: fine) {
            #joystick-zone { display: none; }
        }

        /* Intro Undertale */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; text-align: center;
        }
        .dialogue-box {
            border: 4px solid #fff; background: #000; padding: 20px; border-radius: 12px;
            max-width: 550px; width: 100%; min-height: 130px; display: flex; align-items: center;
            box-shadow: 0 0 25px rgba(255,255,255,0.2);
        }
        #dialogue-text { font-size: 1rem; line-height: 1.5; color: #fff; text-align: left; font-family: monospace; }
        .skip-intro {
            margin-top: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: #cbd5e1; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
        }

        /* UI Superior */
        #ui-overlay {
            position: absolute; top: 15px; left: 0; width: 100%; display: flex;
            justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; pointer-events: none;
        }
        .interactive-elem { pointer-events: auto; }
        
        .location-switch, .music-toggle {
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 8px 14px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.5); font-size: 0.8rem;
        }
        .info-pill {
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px; border-radius: 30px; font-size: 0.75rem; backdrop-filter: blur(8px); color: #cbd5e1;
        }

        #minigame-score {
            position: absolute; top: 60px; left: 20px; background: rgba(15, 23, 42, 0.85);
            border: 1px solid #fbbf24; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem;
            color: #fbbf24; backdrop-filter: blur(8px); z-index: 10;
        }

        /* Modal de Secretos */
        #star-modal {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95); border: 2px solid #f43f5e; padding: 18px 25px;
            border-radius: 20px; max-width: 400px; width: 90%; text-align: center; z-index: 20;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); backdrop-filter: blur(12px);
            transition: all 0.3s ease; opacity: 0; pointer-events: none;
        }
        #star-modal.active { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
        #star-modal h3 { color: #f43f5e; margin-bottom: 6px; font-size: 1.1rem; }
        #star-modal p { color: #f1f5f9; font-size: 0.85rem; line-height: 1.4; }
        #star-modal button {
            margin-top: 12px; background: #f43f5e; border: none; color: white; padding: 6px 14px;
            border-radius: 10px; cursor: pointer; font-weight: bold;
        }

        .instructions {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.7); font-size: 0.75rem; pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9); font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- AVISO ROTACIÓN -->
    <div id="rotate-warning">
        <div class="rotate-icon">📱</div>
        <h2>¡Voltea tu teléfono, mi niña! 💖</h2>
        <p>Para disfrutar este observatorio 3D y ver las estrellas con el joystick táctil, pon tu celular en horizontal.</p>
    </div>

    <!-- INTRO UNDERTALE -->
    <div id="intro-overlay">
        <div class="dialogue-box"><div id="dialogue-text"></div></div>
        <button class="skip-intro interactive-elem" onclick="skipIntro()">Saltar intro ⏭️</button>
    </div>

    <!-- UI SUPERIOR -->
    <div id="ui-overlay">
        <div class="info-pill interactive-elem">📅 11 Oct 2026 • 18:32</div>
        <div style="display: flex; gap: 6px;">
            <button id="music-btn" class="music-toggle interactive-elem" onclick="toggleMusic()">🎵 Música: Off</button>
            <button id="loc-btn" class="location-switch interactive-elem" onclick="toggleLocation()">🇵🇪 Huacho</button>
        </div>
    </div>

    <div id="minigame-score">🌠 Estrellas: <span id="score-val">0</span> / 3</div>
    
    <!-- JOYSTICK VIRTUAL -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="canvas-container"></div>
    <div class="instructions">🎮 Palanca / WASD para caminar • Desliza en pantalla para mirar ✨</div>

    <!-- MODAL DE TEXTO -->
    <div id="star-modal">
        <h3 id="modal-star-title">✨ Astromensaje</h3>
        <p id="modal-star-desc">Contenido secreto...</p>
        <button onclick="closeStarModal()">Cerrar 💖</button>
    </div>

    <audio id="bg-audio" loop src="media/musica11.mp3"></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. INTRO UNDERTALE ---
        const introLines = [
            "11 de octubre...", "A las 18:32 horas...",
            "Dos almas que durante meses se sentían atraídas...", "pero nunca lo confesaron...",
            "Finalmente decidieron dejar sus miedos atrás...", "y confesarse todo...",
            "Dando inicio a una bonita relación...", "Y este... fue el cielo que lo vio todo..."
        ];
        let lineIndex = 0, charIndex = 0, isTyping = true, audioCtx = null;
        const dialogueTextEl = document.getElementById('dialogue-text');

        function playBlip() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320 + Math.random() * 120, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.07);
            } catch(e) {}
        }

        function typeWriter() {
            if (!isTyping) return;
            if (lineIndex < introLines.length) {
                const line = introLines[lineIndex];
                if (charIndex < line.length) {
                    dialogueTextEl.textContent += line.charAt(charIndex);
                    if (line.charAt(charIndex) !== ' ') playBlip();
                    charIndex++; setTimeout(typeWriter, 40);
                } else {
                    setTimeout(() => { charIndex = 0; lineIndex++; dialogueTextEl.textContent = ""; typeWriter(); }, 1300);
                }
            } else { skipIntro(); }
        }

        function skipIntro() {
            isTyping = false;
            const overlay = document.getElementById('intro-overlay');
            if(overlay) { overlay.style.opacity = '0'; setTimeout(() => overlay.remove(), 400); }
        }
        window.addEventListener('click', () => { if (!audioCtx && document.getElementById('intro-overlay')) typeWriter(); }, { once: true });
        setTimeout(() => { if (document.getElementById('intro-overlay') && !audioCtx) typeWriter(); }, 500);

        let musicPlaying = false;
        const bgAudio = document.getElementById('bg-audio');
        function toggleMusic() {
            const btn = document.getElementById('music-btn');
            if (!musicPlaying) {
                bgAudio.play().then(() => { musicPlaying = true; btn.textContent = "🎵 Música: On"; btn.style.borderColor = "#22c55e"; });
            } else {
                bgAudio.pause(); musicPlaying = false; btn.textContent = "🎵 Música: Off"; btn.style.borderColor = "rgba(244,63,94,0.4)";
            }
        }

        // --- 2. TEXTURAS Y CÁMARA 3D ---
        function createCircleTexture(colorStr, glowColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64,64,0, 64,64,64);
            grad.addColorStop(0, colorStr);
            grad.addColorStop(0.3, glowColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        const starTexture = createCircleTexture('#ffffff', 'rgba(147, 197, 253, 0.8)');
        const fireflyTexture = createCircleTexture('#fde047', 'rgba(251, 191, 36, 0.6)');

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.007);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. CONTROLES COMBINADOS (WASD + JOYSTICK MÓVIL) ---
        const moveState = { forward: 0, right: 0 };
        const walkSpeed = 0.12;

        // Teclado (PC)
        window.addEventListener('keydown', (e) => {
            if (['w','W','ArrowUp'].includes(e.key)) moveState.forward = 1;
            if (['s','S','ArrowDown'].includes(e.key)) moveState.forward = -1;
            if (['d','D','ArrowRight'].includes(e.key)) moveState.right = 1;
            if (['a','A','ArrowLeft'].includes(e.key)) moveState.right = -1;
        });
        window.addEventListener('keyup', (e) => {
            if (['w','W','s','S','ArrowUp','ArrowDown'].includes(e.key)) moveState.forward = 0;
            if (['a','A','d','D','ArrowLeft','ArrowRight'].includes(e.key)) moveState.right = 0;
        });

        // Joystick Táctil (Móvil)
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joyActive = false, joyStartPos = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            e.stopPropagation(); joyActive = true;
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            joyStartPos = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        });

        window.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            const touch = Array.from(e.touches).find(t => t.target === joystickZone || joystickZone.contains(t.target)) || e.touches[0];
            const deltaX = touch.clientX - joyStartPos.x;
            const deltaY = touch.clientY - joyStartPos.y;
            const dist = Math.min(Math.hypot(deltaX, deltaY), 40);
            const angle = Math.atan2(deltaY, deltaX);

            const knobX = Math.cos(angle) * dist;
            const knobY = Math.sin(angle) * dist;
            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

            moveState.right = knobX / 40;
            moveState.forward = -knobY / 40;
        });

        window.addEventListener('touchend', () => {
            if (joyActive) {
                joyActive = false;
                joystickKnob.style.transform = `translate(0px, 0px)`;
                moveState.forward = 0; moveState.right = 0;
            }
        });

        // Girar Vista con Arrastre
        let isDragging = false, prevMouse = { x: 0, y: 0 }, lon = 0, lat = 10;
        container.addEventListener('mousedown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            lon -= (e.clientX - prevMouse.x) * 0.22;
            lat += (e.clientY - prevMouse.y) * 0.22;
            lat = Math.max(-30, Math.min(75, lat));
            prevMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => isDragging = false);

        container.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1 && !joyActive) { isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || joyActive || e.touches.length !== 1) return;
            lon -= (e.touches[0].clientX - prevMouse.x) * 0.22;
            lat += (e.touches[0].clientY - prevMouse.y) * 0.22;
            lat = Math.max(-30, Math.min(75, lat));
            prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchend', () => isDragging = false);


        // --- 4. ENTORNO Y ÁRBOLES 3D ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: 0x040f07 }));
        ground.rotation.x = -Math.PI / 2; scene.add(ground);

        const treesGroup = new THREE.Group();
        const treeGeo = new THREE.ConeGeometry(3, 12, 6);
        const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 3, 6);
        const treeMat = new THREE.MeshBasicMaterial({ color: 0x022c14 });
        const trunkMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

        for(let i=0; i<45; i++) {
            const tree = new THREE.Group();
            const foliage = new THREE.Mesh(treeGeo, treeMat); foliage.position.y = 6;
            const trunk = new THREE.Mesh(trunkGeo, trunkMat); trunk.position.y = 1.5;
            tree.add(foliage); tree.add(trunk);
            const angle = Math.random() * Math.PI * 2;
            const radius = 25 + Math.random() * 80;
            tree.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            treesGroup.add(tree);
        }
        scene.add(treesGroup);

        // Luciérnagas y Estrellas
        const ffGeo = new THREE.BufferGeometry(); const ffPos = new Float32Array(90 * 3);
        for(let i=0; i<270; i+=3) { ffPos[i] = (Math.random() - 0.5) * 140; ffPos[i+1] = Math.random() * 3 + 0.5; ffPos[i+2] = (Math.random() - 0.5) * 140; }
        ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
        const fireflies = new THREE.Points(ffGeo, new THREE.PointsMaterial({ size: 2.5, map: fireflyTexture, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
        scene.add(fireflies);

        const starsGeo = new THREE.BufferGeometry(); const starsPos = new Float32Array(2200 * 3);
        for(let i=0; i<6600; i+=3) { starsPos[i] = (Math.random() - 0.5) * 500; starsPos[i+1] = Math.random() * 250 + 20; starsPos[i+2] = (Math.random() - 0.5) * 500; }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 3.5, map: starTexture, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
        scene.add(starField);


        // --- 5. ASTROS INTERACTIVOS ---
        const interactiveGroup = new THREE.Group(); scene.add(interactiveGroup);

        const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), new THREE.MeshBasicMaterial({ color: 0xfef08a }));
        moonMesh.position.set(-40, 50, -110);
        moonMesh.userData = { title: "🌙 La Luna en Huacho (2% creciente)", desc: "A las 18:32 del 11 de octubre de 2026, esta fina luna creciente iluminaba el cielo costero cuando todo comenzó." };
        interactiveGroup.add(moonMesh);

        const venusMesh = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffedd5 }));
        venusMesh.position.set(-25, 28, -85);
        venusMesh.userData = { title: "✨ Venus (Lucero de la Tarde)", desc: "Brillando con intensidad en el horizonte oeste, testigo del momento exacto en que decidimos decirnos la verdad." };
        interactiveGroup.add(venusMesh);

        const vegaMesh = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 16), new THREE.MeshBasicMaterial({ color: 0x93c5fd }));
        vegaMesh.position.set(50, 80, -95);
        vegaMesh.userData = { title: "⭐ Estrella Vega", desc: "La reina del firmamento nocturno. Bajo sus destellos se unieron nuestras dos historias para siempre." };
        interactiveGroup.add(vegaMesh);


        // --- 6. MINIJUEGO: ESTRELLAS FUGACES ---
        let collectedStars = 0;
        function spawnShootingStar() {
            const star = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
            star.position.set(camera.position.x + (Math.random() - 0.5) * 60, Math.random() * 20 + 15, camera.position.z - (Math.random() * 40 + 20));
            star.userData = { isCollectible: true, title: "🌠 ¡Estrella Atrapada!", desc: `¡Has atrapado una estrella fugaz! (${++collectedStars}/3). Mi único deseo siempre será seguir caminando a tu lado. 💖` };
            scene.add(star); interactiveGroup.add(star);
            setTimeout(() => { if(star.parent) { scene.remove(star); interactiveGroup.remove(star); } }, 7000);
        }
        setInterval(() => { if(collectedStars < 3 && Math.random() > 0.3) spawnShootingStar(); }, 5000);

        let currentLoc = 'huacho';
        function toggleLocation() {
            const btn = document.getElementById('loc-btn');
            if (currentLoc === 'huacho') {
                currentLoc = 'guatemala'; btn.innerHTML = '🇬🇹 Guatemala';
                moonMesh.position.set(-30, 46, -100); venusMesh.position.set(-18, 26, -80);
            } else {
                currentLoc = 'huacho'; btn.innerHTML = '🇵🇪 Huacho';
                moonMesh.position.set(-40, 50, -110); venusMesh.position.set(-25, 28, -85);
            }
        }

        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveGroup.children);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                showStarModal(obj.userData.title, obj.userData.desc);
                if (obj.userData.isCollectible) {
                    document.getElementById('score-val').textContent = collectedStars;
                    scene.remove(obj); interactiveGroup.remove(obj);
                }
            }
        });

        function showStarModal(title, desc) { document.getElementById('modal-star-title').textContent = title; document.getElementById('modal-star-desc').textContent = desc; document.getElementById('star-modal').classList.add('active'); }
        function closeStarModal() { document.getElementById('star-modal').classList.remove('active'); }


        // --- 7. ANIMACIÓN BUCLE Y MOVIMIENTO ---
        function animate() {
            requestAnimationFrame(animate);

            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);

            const forward = new THREE.Vector3(Math.sin(phi)*Math.sin(theta), 0, Math.sin(phi)*Math.cos(theta)).normalize();
            const side = new THREE.Vector3(Math.sin(theta - Math.PI/2), 0, Math.cos(theta - Math.PI/2)).normalize();

            if (moveState.forward !== 0) camera.position.addScaledVector(forward, walkSpeed * moveState.forward);
            if (moveState.right !== 0) camera.position.addScaledVector(side, walkSpeed * moveState.right);

            camera.position.y = 1.7;

            const targetLookAt = new THREE.Vector3(
                camera.position.x + 100 * Math.sin(phi) * Math.sin(theta),
                camera.position.y + 100 * Math.cos(phi),
                camera.position.z + 100 * Math.sin(phi) * Math.cos(theta)
            );
            camera.lookAt(targetLookAt);

            fireflies.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
