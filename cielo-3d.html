<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>El Cielo Que Lo Vio Todo - GOTY Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050814; font-family: 'Inter', sans-serif; color: #f8fafc; }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        /* AVISO ROTACIÓN MÓVIL */
        #rotate-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050814; z-index: 999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px;
        }
        #rotate-warning h2 { color: #f43f5e; margin-bottom: 15px; font-size: 1.4rem; }
        #rotate-warning p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; max-width: 320px; }
        .rotate-icon { font-size: 3.5rem; margin-bottom: 15px; animation: rotatePhone 2s infinite ease-in-out; }
        @keyframes rotatePhone { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
        @media screen and (max-width: 900px) and (orientation: portrait) { #rotate-warning { display: flex; } }

        /* JOYSTICK TÁCTIL */
        #joystick-zone {
            position: absolute; bottom: 25px; left: 25px; width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(244, 63, 94, 0.3);
            border-radius: 50%; z-index: 15; backdrop-filter: blur(6px); touch-action: none;
            display: flex; justify-content: center; align-items: center;
        }
        #joystick-knob {
            width: 40px; height: 40px; background: rgba(244, 63, 94, 0.8);
            border-radius: 50%; box-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
            position: absolute; pointer-events: none; transition: transform 0.05s ease-out;
        }
        @media (pointer: fine) { #joystick-zone { display: none; } }

        /* BOTÓN INTERACCIÓN / PUERTA */
        #interact-btn {
            position: absolute; bottom: 30px; right: 30px; width: 68px; height: 68px;
            background: linear-gradient(135deg, #f43f5e, #ec4899); border: 2px solid #fff;
            border-radius: 50%; color: white; font-size: 1.4rem; font-weight: bold;
            display: none; justify-content: center; align-items: center; z-index: 15;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.7); cursor: pointer;
        }
        #interact-btn.active { display: flex; animation: pulseBtn 1s infinite alternate; }
        @keyframes pulseBtn { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* INTRO */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; text-align: center;
        }
        .dialogue-box {
            border: 3px solid #fff; background: #000; padding: 22px; border-radius: 12px;
            max-width: 550px; width: 100%; min-height: 130px; display: flex; align-items: center;
            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }
        #dialogue-text { font-size: 1rem; line-height: 1.5; color: #fff; text-align: left; font-family: monospace; }
        .skip-intro {
            margin-top: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: #cbd5e1; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
        }

        /* UI SUPERIOR */
        #ui-overlay {
            position: absolute; top: 15px; left: 0; width: 100%; display: flex;
            justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; pointer-events: none;
        }
        .interactive-elem { pointer-events: auto; }
        
        .location-switch, .music-toggle {
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 7px 14px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(8px); font-size: 0.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .info-pill {
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 7px 14px; border-radius: 30px; font-size: 0.75rem; backdrop-filter: blur(8px); color: #cbd5e1;
        }

        #minigame-score {
            position: absolute; top: 60px; left: 20px; background: rgba(15, 23, 42, 0.85);
            border: 1px solid #fbbf24; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem;
            color: #fbbf24; backdrop-filter: blur(8px); z-index: 10; font-weight: bold;
        }

        /* INSTRUCCIONES INFERIOR */
        #instructions-box {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 16px; border-radius: 15px; backdrop-filter: blur(6px);
            z-index: 10; text-align: center; max-width: 90%; width: 520px;
        }
        #instructions-box p { color: #cbd5e1; font-size: 0.73rem; }
        #instructions-box span { color: #f43f5e; font-weight: bold; }

        /* MODAL */
        #star-modal {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: rgba(15, 23, 42, 0.95); border: 2px solid #f43f5e; padding: 20px 25px;
            border-radius: 20px; max-width: 400px; width: 90%; text-align: center; z-index: 20;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); backdrop-filter: blur(12px);
            transition: all 0.3s ease; opacity: 0; pointer-events: none;
        }
        #star-modal.active { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
        #star-modal h3 { color: #f43f5e; margin-bottom: 8px; font-size: 1.1rem; }
        #star-modal p { color: #f1f5f9; font-size: 0.85rem; line-height: 1.4; }
        #star-modal button {
            margin-top: 12px; background: #f43f5e; border: none; color: white; padding: 6px 16px;
            border-radius: 10px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="rotate-icon">📱</div>
        <h2>¡Voltea tu teléfono! 💖</h2>
        <p>Para explorar este observatorio 3D, gira tu celular en horizontal.</p>
    </div>

    <div id="intro-overlay">
        <div class="dialogue-box"><div id="dialogue-text"></div></div>
        <button class="skip-intro interactive-elem" onclick="skipIntro()">Saltar intro ⏭️</button>
    </div>

    <div id="ui-overlay">
        <div class="info-pill interactive-elem">📅 11 Oct 2026 • 18:32</div>
        <div style="display: flex; gap: 6px;">
            <button id="music-btn" class="music-toggle interactive-elem" onclick="toggleMusic()">🎵 Música: Off</button>
            <button id="loc-btn" class="location-switch interactive-elem" onclick="toggleLocation()">🇵🇪 Huacho</button>
        </div>
    </div>

    <div id="minigame-score">🎒 Recuerdos: <span id="score-val">0</span> / 4</div>
    
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="interact-btn">🚪</div>

    <div id="canvas-container"></div>

    <div id="instructions-box">
        <p>🎮 <span>Moverse:</span> WASD / Palanca &nbsp;|&nbsp; <span>Puerta/Recoger:</span> [E] o Botón &nbsp;|&nbsp; <span>Mirar:</span> Arrastra pantalla</p>
    </div>

    <div id="star-modal">
        <h3 id="modal-star-title">✨ Recuerdo</h3>
        <p id="modal-star-desc">...</p>
        <button onclick="closeStarModal()">Cerrar 💖</button>
    </div>

    <audio id="bg-audio" loop src="media/musica11.mp3"></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. INTRO ---
        const introLines = [
            "11 de octubre de 2026...", "A las 18:32 horas...",
            "Bajo el cielo de Huacho y Guatemala...",
            "La luna creciente y Venus fueron testigos de todo...",
            "Explora el bosque, entra a la cabaña y descubre los recuerdos..."
        ];
        let lineIndex = 0, charIndex = 0, isTyping = true, audioCtx = null;
        const dialogueTextEl = document.getElementById('dialogue-text');

        function playSound(freq, duration = 0.08) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function typeWriter() {
            if (!isTyping) return;
            if (lineIndex < introLines.length) {
                const line = introLines[lineIndex];
                if (charIndex < line.length) {
                    dialogueTextEl.textContent += line.charAt(charIndex);
                    if (line.charAt(charIndex) !== ' ') playSound(320 + Math.random() * 100);
                    charIndex++; setTimeout(typeWriter, 40);
                } else {
                    setTimeout(() => { charIndex = 0; lineIndex++; dialogueTextEl.textContent = ""; typeWriter(); }, 1300);
                }
            } else { skipIntro(); }
        }

        function skipIntro() {
            isTyping = false;
            const overlay = document.getElementById('intro-overlay');
            if(overlay) { overlay.style.opacity = '0'; setTimeout(() => overlay.remove(), 400); }
        }
        window.addEventListener('click', () => { if (!audioCtx && document.getElementById('intro-overlay')) typeWriter(); }, { once: true });
        setTimeout(() => { if (document.getElementById('intro-overlay') && !audioCtx) typeWriter(); }, 500);

        let musicPlaying = false;
        const bgAudio = document.getElementById('bg-audio');
        function toggleMusic() {
            const btn = document.getElementById('music-btn');
            if (!musicPlaying) {
                bgAudio.play().then(() => { musicPlaying = true; btn.textContent = "🎵 Música: On"; btn.style.borderColor = "#22c55e"; });
            } else {
                bgAudio.pause(); musicPlaying = false; btn.textContent = "🎵 Música: Off"; btn.style.borderColor = "rgba(244,63,94,0.4)";
            }
        }

        // --- 2. ESCENA 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050814, 0.0045);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. COLISIONES Y MOVIMIENTO ---
        const moveState = { forward: 0, right: 0 };
        const walkSpeed = 0.12;
        let insideCabin = false;

        function checkCollision(newX, newZ) {
            // Si está dentro de la cabaña, limitar al perímetro interior
            if (insideCabin) {
                if (newX < -3.3 || newX > 3.3 || newZ < -18.8 || newZ > -11.2) {
                    // Permitir salir por la puerta (en z = -11.2 y x cerca de 0)
                    if (Math.abs(newX) < 1.2 && newZ >= -11.5 && newZ <= -10.8) return false;
                    return true; // Bloqueado por paredes
                }
                return false;
            }
            // Colisión con paredes exteriores de la cabaña (x: -3.5 a 3.5, z: -19 a -11)
            if (newX > -3.7 && newX < 3.7 && newZ > -19.2 && newZ < -10.8) {
                // Permitir entrar si está en la puerta (x entre -1 y 1, z cerca de -11)
                if (Math.abs(newX) < 1.2 && newZ >= -11.5 && newZ <= -10.5) return false;
                return true;
            }
            return false;
        }

        window.addEventListener('keydown', (e) => {
            if (['w','W','ArrowUp'].includes(e.key)) moveState.forward = 1;
            if (['s','S','ArrowDown'].includes(e.key)) moveState.forward = -1;
            if (['d','D','ArrowRight'].includes(e.key)) moveState.right = 1;
            if (['a','A','ArrowLeft'].includes(e.key)) moveState.right = -1;
            if (e.key === 'e' || e.key === 'E') triggerInteraction();
        });
        window.addEventListener('keyup', (e) => {
            if (['w','W','s','S','ArrowUp','ArrowDown'].includes(e.key)) moveState.forward = 0;
            if (['a','A','d','D','ArrowLeft','ArrowRight'].includes(e.key)) moveState.right = 0;
        });

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joyActive = false, joyStartPos = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            e.stopPropagation(); joyActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joyStartPos = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        });
        window.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            const touch = Array.from(e.touches).find(t => t.target === joystickZone || joystickZone.contains(t.target)) || e.touches[0];
            const deltaX = touch.clientX - joyStartPos.x, deltaY = touch.clientY - joyStartPos.y;
            const dist = Math.min(Math.hypot(deltaX, deltaY), 35), angle = Math.atan2(deltaY, deltaX);
            joystickKnob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
            moveState.right = (Math.cos(angle) * dist) / 35; moveState.forward = -(Math.sin(angle) * dist) / 35;
        });
        window.addEventListener('touchend', () => {
            if (joyActive) { joyActive = false; joystickKnob.style.transform = `translate(0px, 0px)`; moveState.forward = 0; moveState.right = 0; }
        });

        let isDragging = false, prevMouse = { x: 0, y: 0 }, lon = 0, lat = 10;
        container.addEventListener('mousedown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            lon -= (e.clientX - prevMouse.x) * 0.22; lat += (e.clientY - prevMouse.y) * 0.22;
            lat = Math.max(-30, Math.min(75, lat)); prevMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => isDragging = false);

        container.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1 && !joyActive) { isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || joyActive || e.touches.length !== 1) return;
            lon -= (e.touches[0].clientX - prevMouse.x) * 0.22; lat += (e.touches[0].clientY - prevMouse.y) * 0.22;
            lat = Math.max(-30, Math.min(75, lat)); prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchend', () => isDragging = false);


        // --- 4. ENTORNO Y CABAÑA FUNCIONAL ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: 0x03080f }));
        ground.rotation.x = -Math.PI / 2; scene.add(ground);

        // Cabaña detallada con interior
        const cabinGroup = new THREE.Group();
        const wallsMat = new THREE.MeshBasicMaterial({ color: 0x2d1810 });
        const roofMat = new THREE.MeshBasicMaterial({ color: 0x4a1d1d });

        // Paredes exteriores
        const wallFront = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.4), wallsMat); wallFront.position.set(0, 2, 4);
        const wallBack = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.4), wallsMat); wallBack.position.set(0, 2, -4);
        const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4, 8.4), wallsMat); wallLeft.position.set(-4, 2, 0);
        const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4, 8.4), wallsMat); wallRight.position.set(4, 2, 0);
        
        // Techo a dos aguas
        const roof = new THREE.Mesh(new THREE.ConeGeometry(6, 3, 4), roofMat);
        roof.position.y = 5.5; roof.rotation.y = Math.PI / 4;

        // Interior: Chimenea y alfombra
        const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 3), new THREE.MeshBasicMaterial({ color: 0x7f1d1d }));
        rug.rotation.x = -Math.PI / 2; rug.position.set(0, 0.01, 0);

        cabinGroup.add(wallFront); cabinGroup.add(wallBack); cabinGroup.add(wallLeft); cabinGroup.add(wallRight);
        cabinGroup.add(roof); cabinGroup.add(rug);
        cabinGroup.position.set(0, 0, -15);
        scene.add(cabinGroup);

        // Pinos detallados en el bosque
        const treesGroup = new THREE.Group();
        for(let i=0; i<40; i++) {
            const tree = new THREE.Group();
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(3, 12, 6), new THREE.MeshBasicMaterial({ color: 0x062314 }));
            foliage.position.y = 6;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3, 6), new THREE.MeshBasicMaterial({ color: 0x1e1b18 }));
            trunk.position.y = 1.5;
            tree.add(foliage); tree.add(trunk);
            const angle = Math.random() * Math.PI * 2, radius = 22 + Math.random() * 80;
            tree.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            treesGroup.add(tree);
        }
        scene.add(treesGroup);

        // Luciérnagas
        const ffGeo = new THREE.BufferGeometry(); const ffPos = new Float32Array(120 * 3);
        for(let i=0; i<360; i+=3) { ffPos[i] = (Math.random() - 0.5) * 140; ffPos[i+1] = Math.random() * 3 + 0.5; ffPos[i+2] = (Math.random() - 0.5) * 140; }
        ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
        scene.add(new THREE.Points(ffGeo, new THREE.PointsMaterial({ size: 2.5, color: 0xfbbf24, transparent: true, opacity: 0.85 })));


        // --- 5. ASTRONOMÍA VERÍDICA (11 OCT 2026 - 18:32) ---
        const starsGeo = new THREE.BufferGeometry(); const starsPos = new Float32Array(3000 * 3);
        for(let i=0; i<9000; i+=3) { starsPos[i] = (Math.random() - 0.5) * 500; starsPos[i+1] = Math.random() * 250 + 20; starsPos[i+2] = (Math.random() - 0.5) * 500; }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 1.8, color: 0xbae6fd, transparent: true, opacity: 0.8 })));

        // La Luna Creciente inicial + Venus en el oeste
        const moonGroup = new THREE.Group();
        const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 32), new THREE.MeshBasicMaterial({ color: 0xfef08a }));
        moonGroup.add(moonMesh);
        moonGroup.position.set(-50, 25, -120); // Muy baja en el horizonte oeste a las 18:32
        scene.add(moonGroup);
        moonMesh.userData = { title: "🌙 Luna del 11 de Oct • 18:32", desc: "Fina luna creciente (0.4%-1% iluminación) poniéndose por el oeste tras el anochecer[cite: 1, 2, 3]." };

        const venusMesh = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffedd5 }));
        venusMesh.position.set(-40, 28, -110); // En conjunción con la luna en el oeste
        venusMesh.userData = { title: "✨ Planeta Venus", desc: "Brillando en conjunción aparente junto a la luna en el horizonte oeste (INSIVUMEH)[cite: 1]." };
        
        const interactiveGroup = new THREE.Group(); scene.add(interactiveGroup);
        interactiveGroup.add(moonMesh); interactiveGroup.add(venusMesh);


        // --- 6. 4 RECUERDOS (2 HUACHO, 2 GUATE / 1 DENTRO DE CABAÑA) ---
        const objectsToFind = [
            { pos: new THREE.Vector3(-12, 0, -10), title: "🇵🇪 Huacho: El Amanecer", desc: "El día comenzó con la costa peruana y la rutina universitaria.", activated: false },
            { pos: new THREE.Vector3(14, 0, -12), title: "🇬🇹 Guatemala: Mixco", desc: "A las 18:32 el cielo de Mixco presenciaba la conjunción de Venus y la luna[cite: 1].", activated: false },
            { pos: new THREE.Vector3(8, 0, -18), title: "💬 Discord (Junio 2026)", desc: "El servidor compartido donde empezó nuestra hermosa coincidencia.", activated: false },
            { pos: new THREE.Vector3(0, 0, -15), title: "💖 La Confesión (Adentro de Cabaña)", desc: "Dejar los miedos atrás a las 18:32 y dar inicio a nuestra relación.", activated: false, inside: true }
        ];

        const objectsGroup = new THREE.Group();
        objectsToFind.forEach((obj, idx) => {
            const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.8), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
            mesh.position.copy(obj.pos); mesh.position.y = obj.inside ? 1.0 : 0.8;
            mesh.userData = { objIdx: idx };
            objectsGroup.add(mesh);
            obj.mesh = mesh;
        });
        scene.add(objectsGroup);

        let foundCount = 0;
        const interactBtn = document.getElementById('interact-btn');

        function checkProximity() {
            let nearAny = false;
            // Checar puerta de la cabaña (cerca de x:0, z:-11)
            const distDoor = camera.position.distanceTo(new THREE.Vector3(0, 1.7, -11));
            if (distDoor < 3.5) {
                nearAny = true;
                if(interactBtn) {
                    interactBtn.textContent = insideCabin ? "🚪 Salir" : "🚪 Entrar";
                    interactBtn.classList.add('active');
                }
            }

            // Checar recuerdos
            objectsToFind.forEach(obj => {
                const dist = camera.position.distanceTo(obj.pos);
                if (dist < 4 && !obj.activated) {
                    nearAny = true;
                    if(interactBtn) {
                        interactBtn.textContent = "🎁";
                        interactBtn.classList.add('active');
                    }
                }
            });

            if (!nearAny && interactBtn) interactBtn.classList.remove('active');
        }

        function triggerInteraction() {
            // Activar puerta si está cerca
            const distDoor = camera.position.distanceTo(new THREE.Vector3(0, 1.7, -11));
            if (distDoor < 3.5) {
                insideCabin = !insideCabin;
                camera.position.set(0, 1.7, insideCabin ? -13.5 : -9.5);
                playSound(440, 0.15);
                return;
            }

            // Recoger recuerdos
            objectsToFind.forEach(obj => {
                const dist = camera.position.distanceTo(obj.pos);
                if (dist < 4 && !obj.activated) {
                    obj.activated = true;
                    foundCount++;
                    obj.mesh.visible = false;
                    document.getElementById('score-val').textContent = foundCount;
                    playSound(523.25, 0.15);
                    setTimeout(() => playSound(659.25, 0.2), 120);
                    showStarModal(obj.title, obj.desc);
                    if(interactBtn) interactBtn.classList.remove('active');
                }
            });
        }

        if(interactBtn) interactBtn.addEventListener('click', triggerInteraction);

        let currentLoc = 'huacho';
        function toggleLocation() {
            const btn = document.getElementById('loc-btn');
            if (currentLoc === 'huacho') {
                currentLoc = 'guatemala'; btn.innerHTML = '🇬🇹 Guatemala';
            } else {
                currentLoc = 'huacho'; btn.innerHTML = '🇵🇪 Huacho';
            }
        }

        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveGroup.children);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if(obj.userData && obj.userData.title) showStarModal(obj.userData.title, obj.userData.desc);
            }
        });

        function showStarModal(title, desc) { document.getElementById('modal-star-title').textContent = title; document.getElementById('modal-star-desc').textContent = desc; document.getElementById('star-modal').classList.add('active'); }
        function closeStarModal() { document.getElementById('star-modal').classList.remove('active'); }


        // --- 7. ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);

            const forward = new THREE.Vector3(Math.sin(phi)*Math.sin(theta), 0, Math.sin(phi)*Math.cos(theta)).normalize();
            const side = new THREE.Vector3(Math.sin(theta - Math.PI/2), 0, Math.cos(theta - Math.PI/2)).normalize();

            let nextX = camera.position.x;
            let nextZ = camera.position.z;

            if (moveState.forward !== 0) {
                nextX += forward.x * walkSpeed * moveState.forward;
                nextZ += forward.z * walkSpeed * moveState.forward;
            }
            if (moveState.right !== 0) {
                nextX += side.x * walkSpeed * moveState.right;
                nextZ += side.z * walkSpeed * moveState.right;
            }

            if (!checkCollision(nextX, nextZ)) {
                camera.position.x = nextX;
                camera.position.z = nextZ;
            }

            camera.position.y = 1.7;

            const targetLookAt = new THREE.Vector3(
                camera.position.x + 100 * Math.sin(phi) * Math.sin(theta),
                camera.position.y + 100 * Math.cos(phi),
                camera.position.z + 100 * Math.sin(phi) * Math.cos(theta)
            );
            camera.lookAt(targetLookAt);

            objectsToFind.forEach(obj => { if(obj.mesh && !obj.activated) obj.mesh.rotation.y += 0.03; });

            checkProximity();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
