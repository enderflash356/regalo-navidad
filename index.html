<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una sorpresita para ti 𓆩♡𓆪</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            user-select: none;
        }

        .font-dancing {
            font-family: 'Dancing Script', cursive;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 63, 94, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(244, 63, 94, 0.2);
        }

        .glow-button {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(244, 63, 94, 0.9);
        }

        .skip-button {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            transition: all 0.2s ease;
        }
        .skip-button:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(244, 63, 94, 0.6);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.8), 0 0 40px rgba(244, 63, 94, 0.4), 0 2px 8px rgba(0,0,0,0.9);
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center">

    <!-- 3D Canvas Background -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Overlay Container UI -->
    <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-4 pointer-events-none">

        <!-- Welcome Card -->
        <div id="welcome-card" class="glass-panel p-8 md:p-12 rounded-3xl max-w-lg w-full text-center pointer-events-auto transition-all duration-700 ease-out transform scale-100 opacity-100">
            <h1 class="font-dancing text-4xl sm:text-5xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-rose-400 to-amber-300">
                ¡Hola, mi amor! 𓆩♡𓆪
            </h1>
            <p class="text-slate-300 text-base sm:text-lg mb-6 leading-relaxed">
                He preparado un viaje espacial único e infinito para ti. ¿Lista para volar a través de las estrellas hacia mi corazón? ✨
            </p>
            
            <div class="flex flex-col gap-3">
                <button id="start-btn" class="glow-button text-white font-bold text-lg px-8 py-3.5 rounded-full inline-flex items-center justify-center gap-2 cursor-pointer">
                    <span>Iniciar Viaje Estelar</span>
                    <span class="text-xl">💖💖</span>
                </button>
                <button id="skip-btn" class="skip-button text-slate-300 font-semibold text-sm px-6 py-2.5 rounded-full inline-flex items-center justify-center gap-2 cursor-pointer">
                    <span>Saltar Intro (Ir al Calendario) ⏭️</span>
                </button>
            </div>
        </div>

        <!-- Dynamic Subtitle -->
        <div id="caption-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 w-11/12 max-w-2xl text-center pointer-events-none transition-opacity duration-500 opacity-0">
            <p id="caption-text" class="font-dancing text-2xl sm:text-4xl text-white text-glow font-bold tracking-wide">
            </p>
        </div>

    </div>

    <script>
        const PLANETS_DATA = [
            { id: 'sun', name: 'Sol', text: 'Partiendo desde el brillante Sol...', z: 0, radius: 4.5, color: 0xffaa00, emissive: 0xff4500, offsetX: 0, offsetY: 0 },
            { id: 'mercury', name: 'Mercurio', text: 'Pasando por Mercurio...', z: -25, radius: 0.8, color: 0xa09389, offsetX: 2.2, offsetY: -1.0 },
            { id: 'venus', name: 'Venus', text: 'Cruzando por Venus...', z: -50, radius: 1.3, color: 0xe3bb76, offsetX: -2.5, offsetY: 1.2 },
            { id: 'earth', name: 'La Tierra', text: 'Dejando atrás nuestro bello hogar: La Tierra...', z: -80, radius: 1.5, color: 0x2233ff, emissive: 0x051133, offsetX: 2.8, offsetY: -1.5 },
            { id: 'mars', name: 'Marte', text: 'Contemplando el desierto rojo de Marte...', z: -110, radius: 1.1, color: 0xc1440e, offsetX: -2.2, offsetY: 1.0 },
            { id: 'jupiter', name: 'Júpiter', text: 'Admirando la inmensidad de Júpiter...', z: -150, radius: 3.2, color: 0xd8ca9d, offsetX: 3.5, offsetY: -1.8 },
            { id: 'saturn', name: 'Saturno', text: 'Sobrevolando los espectaculares anillos de Saturno...', z: -200, radius: 2.5, color: 0xe2bf7d, hasRings: true, offsetX: -3.8, offsetY: 2.0 },
            { id: 'uranus', name: 'Urano', text: 'Viajando hacia los confines fríos de Urano...', z: -250, radius: 1.8, color: 0x4b70dd, offsetX: 2.5, offsetY: -1.2 },
            { id: 'neptune', name: 'Neptuno', text: 'Llegando al azul profundo de Neptuno...', z: -300, radius: 1.7, color: 0x274687, offsetX: -2.0, offsetY: 1.5 },
            { id: 'heart', name: 'Corazón', text: '¡Y llegando a mi lugar favorito... Tu corazón! 💖', z: -355, isHeart: true, radius: 2.5, color: 0xff1493, offsetX: 0, offsetY: 0 }
        ];

        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff5ea, 2.5, 500);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3500;
        const starPositions = new Float32Array(starsCount * 3);
        
        for (let i = 0; i < starsCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 600;
            starPositions[i + 1] = (Math.random() - 0.5) * 600;
            starPositions[i + 2] = -Math.random() * 500 + 50;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        const celestialObjects = [];

        function createPlanetTexture(colorHex, isSun = false) {
            const canvasTex = document.createElement('canvas');
            canvasTex.width = 512;
            canvasTex.height = 256;
            const ctx = canvasTex.getContext('2d');

            ctx.fillStyle = '#' + new THREE.Color(colorHex).getHexString();
            ctx.fillRect(0, 0, 512, 256);

            for (let i = 0; i < 40; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.15})`;
                ctx.fillRect(0, Math.random() * 256, 512, Math.random() * 20 + 2);
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.15})`;
                ctx.fillRect(0, Math.random() * 256, 512, Math.random() * 20 + 2);
            }
            return new THREE.CanvasTexture(canvasTex);
        }

        function createHeartMesh() {
            const shape = new THREE.Shape();
            const x = 0, y = 0;
            shape.moveTo(x + 25, y + 25);
            shape.bezierCurveTo(x + 25, y + 25, x + 20, y, x, y);
            shape.bezierCurveTo(x - 30, y, x - 30, y + 35, x - 30, y + 35);
            shape.bezierCurveTo(x - 30, y + 55, x - 10, y + 77, x + 25, y + 95);
            shape.bezierCurveTo(x + 60, y + 77, x + 80, y + 55, x + 80, y + 35);
            shape.bezierCurveTo(x + 80, y + 35, x + 80, y, x + 50, y);
            shape.bezierCurveTo(x + 35, y, x + 25, y + 25, x + 25, y + 25);

            const extrudeSettings = { depth: 15, bevelEnabled: true, bevelSegments: 5, steps: 2, bevelSize: 6, bevelThickness: 6 };
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.center();
            geometry.scale(0.04, 0.04, 0.04);
            geometry.rotateZ(Math.PI);

            const material = new THREE.MeshPhongMaterial({
                color: 0xff1493,
                emissive: 0x990033,
                specular: 0xffffff,
                shininess: 100,
                transparent: true,
                opacity: 0
            });

            return new THREE.Mesh(geometry, material);
        }

        PLANETS_DATA.forEach((data) => {
            let mesh;
            let mat;

            if (data.isHeart) {
                mesh = createHeartMesh();
                mat = mesh.material;
            } else {
                const geo = new THREE.SphereGeometry(data.radius, 48, 48);
                const texture = createPlanetTexture(data.color, data.id === 'sun');
                
                if (data.id === 'sun') {
                    mat = new THREE.MeshBasicMaterial({
                        map: texture,
                        color: data.color,
                        transparent: true,
                        opacity: 0
                    });
                } else {
                    mat = new THREE.MeshStandardMaterial({
                        map: texture,
                        color: data.color,
                        roughness: 0.7,
                        metalness: 0.1,
                        transparent: true,
                        opacity: 0
                    });
                }
                mesh = new THREE.Mesh(geo, mat);

                if (data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.3, 64);
                    const pos = ringGeo.attributes.position;
                    const uv = ringGeo.attributes.uv;
                    for (let i = 0; i < pos.count; i++) {
                        const vertex = new THREE.Vector3().fromBufferAttribute(pos, i);
                        uv.setXY(i, vertex.length() < data.radius * 1.8 ? 0 : 1, 1);
                    }
                    const ringMat = new THREE.MeshStandardMaterial({
                        color: 0xc4a472,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2.3;
                    mesh.add(ringMesh);
                    mesh.userData.ringMat = ringMat;
                }
            }

            mesh.position.set(data.offsetX, data.offsetY, data.z);
            scene.add(mesh);

            celestialObjects.push({
                data: data,
                mesh: mesh,
                material: mat
            });
        });

        let isTravelling = false;
        let flightProgress = 0;
        const flightDuration = 22000;
        let startTime = null;

        const startBtn = document.getElementById('start-btn');
        const skipBtn = document.getElementById('skip-btn');
        const welcomeCard = document.getElementById('welcome-card');
        const captionContainer = document.getElementById('caption-container');
        const captionText = document.getElementById('caption-text');

        startBtn.addEventListener('click', () => {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#f43f5e', '#fbbf24', '#ffffff']
                });
            }

            welcomeCard.style.opacity = '0';
            welcomeCard.style.transform = 'scale(0.8)';
            setTimeout(() => welcomeCard.style.display = 'none', 700);

            setTimeout(() => {
                captionContainer.style.opacity = '1';
                isTravelling = true;
                startTime = performance.now();
            }, 500);
        });

        // Evento para Omitir / Saltar Intro
        skipBtn.addEventListener('click', () => {
            window.location.href = 'calendar.html';
        });

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        const START_Z = 12;
        const END_Z = PLANETS_DATA[PLANETS_DATA.length - 1].z + 6;
        camera.position.set(0, 0, START_Z);

        let activeCaptionIndex = -1;

        function animate(now) {
            requestAnimationFrame(animate);

            celestialObjects.forEach(obj => {
                obj.mesh.rotation.y += 0.005;
                if (obj.data.isHeart) {
                    obj.mesh.rotation.y = Math.sin(now * 0.002) * 0.2;
                    const pulse = 1 + Math.sin(now * 0.005) * 0.06;
                    obj.mesh.scale.set(pulse, pulse, pulse);
                }
            });

            if (isTravelling && startTime) {
                const elapsed = now - startTime;
                flightProgress = Math.min(elapsed / flightDuration, 1);
                
                const easedProgress = easeInOutCubic(flightProgress);
                
                const currentCamZ = START_Z + (END_Z - START_Z) * easedProgress;
                camera.position.z = currentCamZ;

                camera.position.x = Math.sin(easedProgress * Math.PI * 4) * 0.6;
                camera.position.y = Math.cos(easedProgress * Math.PI * 4) * 0.4;

                celestialObjects.forEach(obj => {
                    const dist = obj.mesh.position.z - currentCamZ;
                    
                    let opacity = 0;
                    if (dist < 15 && dist > -60) {
                        if (dist > 0) {
                            opacity = 1 - (dist / 15);
                        } else {
                            opacity = 1 - (Math.abs(dist) / 60);
                        }
                    } else if (dist >= 15 && obj.data.id === 'sun' && currentCamZ > -10) {
                        opacity = 1;
                    }

                    opacity = Math.max(0, Math.min(1, opacity));
                    obj.material.opacity = opacity;

                    if (obj.mesh.userData.ringMat) {
                        obj.mesh.userData.ringMat.opacity = opacity * 0.8;
                    }
                });

                let closestIndex = 0;
                let minDistance = Infinity;

                PLANETS_DATA.forEach((p, idx) => {
                    const d = Math.abs(currentCamZ - p.z);
                    if (d < minDistance) {
                        minDistance = d;
                        closestIndex = idx;
                    }
                });

                if (closestIndex !== activeCaptionIndex) {
                    activeCaptionIndex = closestIndex;
                    
                    captionText.style.opacity = '0';
                    captionText.style.transform = 'translateY(10px)';
                    
                    setTimeout(() => {
                        captionText.textContent = PLANETS_DATA[activeCaptionIndex].text;
                        captionText.style.transition = 'all 0.4s ease-out';
                        captionText.style.opacity = '1';
                        captionText.style.transform = 'translateY(0px)';
                    }, 200);
                }

                if (flightProgress >= 1) {
                    isTravelling = false;
                    setTimeout(() => {
                        captionText.textContent = "¡Te amo muuuuuuchooooo jiji! 💖";
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                        }
                        setTimeout(() => {
                            window.location.href = 'calendar.html';
                        }, 2500);
                    }, 800);
                }
            }
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
