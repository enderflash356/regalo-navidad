<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Girasol Interactivo</title>
  <style>
    .sf-scene {
      --bg-top: #dceeff;
      --bg-mid: #f7fbff;
      --bg-bot: #e6f4d7;
      --hill-back: #9fd38b;
      --hill-front: #6db362;
      --sun-glow: rgba(255, 224, 102, 0.45);
      --panel-bg: rgba(255, 255, 255, 0.78);
      --panel-text: #273226;
      --panel-border: rgba(39, 50, 38, 0.14);

      position: relative;
      width: 100%;
      min-height: 460px;
      height: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 62%, var(--bg-bot) 100%);
      transition: background 0.6s ease, color 0.4s ease;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .sf-scene.is-night {
      --bg-top: #090e1d;
      --bg-mid: #131d38;
      --bg-bot: #162629;
      --hill-back: #163136;
      --hill-front: #0e2226;
      --sun-glow: rgba(130, 177, 255, 0.18);
      --panel-bg: rgba(17, 25, 46, 0.78);
      --panel-text: #eef3ff;
      --panel-border: rgba(238, 243, 255, 0.16);
    }

    .sf-canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 460px;
      cursor: pointer;
    }

    .sf-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 3;
    }

    .sf-btn {
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--panel-text);
      backdrop-filter: blur(8px);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease, background 0.3s ease;
    }

    .sf-btn:hover {
      transform: translateY(-1px);
    }

    .sf-btn:active {
      transform: scale(0.97);
    }

    .sf-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      color: var(--panel-text);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="sf-scene" id="sunflowerScene">
    <div class="sf-controls">
      <button type="button" class="sf-btn" id="sfModeBtn">Modo Noche</button>
      <button type="button" class="sf-btn" id="sfBreezeBtn">Brisa: Suave</button>
    </div>
    <canvas class="sf-canvas" id="sunflowerCanvas"></canvas>
    <div class="sf-hint">Mueve el cursor o haz clic sobre el girasol</div>
  </div>

  <script>
    (function () {
      const scene = document.getElementById("sunflowerScene");
      const canvas = document.getElementById("sunflowerCanvas");
      const modeBtn = document.getElementById("sfModeBtn");
      const breezeBtn = document.getElementById("sfBreezeBtn");
      if (!scene || !canvas) return;

      const ctx = canvas.getContext("2d");

      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let isNight = false;
      let breezeLevel = 1; // 0: calma, 1: suave, 2: animada
      let time = 0;
      let pulse = 0;

      const pointer = {
        x: null,
        y: null,
        active: false
      };

      const particles = [];
      const stars = Array.from({ length: 45 }, () => ({
        x: Math.random(),
        y: Math.random() * 0.55,
        r: 0.7 + Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2
      }));

      function resize() {
        const rect = scene.getBoundingClientRect();
        width = Math.max(300, rect.width || scene.clientWidth || 600);
        height = Math.max(360, rect.height || scene.clientHeight || 480);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawnBurst(cx, cy, count = 18) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
          const speed = 1.1 + Math.random() * 2.8;
          particles.push({
            x: cx + Math.cos(angle) * 18,
            y: cy + Math.sin(angle) * 18,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.6,
            size: 2 + Math.random() * 3.2,
            alpha: 1,
            decay: 0.014 + Math.random() * 0.014,
            sparkle: Math.random() > 0.45
          });
        }
      }

      function spawnAmbientPollen(cx, cy) {
        if (particles.length > 85) return;
        const angle = Math.random() * Math.PI * 2;
        const dist = 20 + Math.random() * 75;
        particles.push({
          x: cx + Math.cos(angle) * dist,
          y: cy + Math.sin(angle) * dist,
          vx: (Math.random() - 0.5) * 0.6,
          vy: -0.35 - Math.random() * 0.65,
          size: 1.5 + Math.random() * 2.2,
          alpha: 0.85,
          decay: 0.006 + Math.random() * 0.006,
          sparkle: true
        });
      }

      function drawBackground() {
        if (isNight) {
          stars.forEach((s) => {
            const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * 2.4 + s.phase));
            ctx.fillStyle = `rgba(255, 250, 220, ${twinkle.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        // Colina trasera
        ctx.fillStyle = isNight ? "#163136" : "#9fd38b";
        ctx.beginPath();
        ctx.moveTo(0, height * 0.82);
        ctx.quadraticCurveTo(width * 0.3, height * 0.7, width * 0.65, height * 0.8);
        ctx.quadraticCurveTo(width * 0.85, height * 0.85, width, height * 0.76);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        // Colina frontal
        ctx.fillStyle = isNight ? "#0e2226" : "#6db362";
        ctx.beginPath();
        ctx.moveTo(0, height * 0.86);
        ctx.quadraticCurveTo(width * 0.45, height * 0.77, width, height * 0.85);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();
      }

      function drawLeaf(x, y, angle, length, widthLeaf, flip = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(flip, 1);

        const grad = ctx.createLinearGradient(0, 0, length, 0);
        if (isNight) {
          grad.addColorStop(0, "#1d472b");
          grad.addColorStop(1, "#2f6e3f");
        } else {
          grad.addColorStop(0, "#3d7a2b");
          grad.addColorStop(1, "#69b342");
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(length * 0.35, -widthLeaf, length * 0.78, -widthLeaf * 0.75, length, 0);
        ctx.bezierCurveTo(length * 0.78, widthLeaf * 0.75, length * 0.35, widthLeaf, 0, 0);
        ctx.fill();

        // Nervadura central
        ctx.strokeStyle = isNight ? "rgba(155, 224, 165, 0.28)" : "rgba(235, 255, 210, 0.45)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(2, 0);
        ctx.quadraticCurveTo(length * 0.5, -widthLeaf * 0.08, length * 0.92, 0);
        ctx.stroke();

        ctx.restore();
      }

      function drawPetal(angle, length, widthPetal, colorStart, colorEnd, swayOffset) {
        ctx.save();
        ctx.rotate(angle + swayOffset);

        const grad = ctx.createLinearGradient(0, 0, 0, -length);
        grad.addColorStop(0, colorStart);
        grad.addColorStop(1, colorEnd);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-widthPetal, -length * 0.28, -widthPetal * 0.92, -length * 0.82, 0, -length);
        ctx.bezierCurveTo(widthPetal * 0.92, -length * 0.82, widthPetal, -length * 0.28, 0, 0);
        ctx.fill();

        ctx.restore();
      }

      function drawSunflower() {
        const amp = breezeLevel === 0 ? 0.008 : breezeLevel === 1 ? 0.025 : 0.055;
        const speed = breezeLevel === 2 ? 2.4 : 1.35;
        const sway = Math.sin(time * speed) * amp;

        const baseX = width * 0.5;
        const baseY = height * 0.9;
        const scale = Math.min(width / 520, height / 520, 1.15);
        const stemHeight = 195 * scale;

        const topX = baseX + Math.sin(sway) * stemHeight;
        const topY = baseY - Math.cos(sway) * stemHeight;

        let tiltX = 0;
        let tiltY = 0;
        if (pointer.active && pointer.x !== null && pointer.y !== null) {
          const dx = (pointer.x - topX) / Math.max(width * 0.5, 1);
          const dy = (pointer.y - topY) / Math.max(height * 0.5, 1);
          tiltX = Math.max(-18, Math.min(18, dx * 16));
          tiltY = Math.max(-12, Math.min(12, dy * 12));
        }

        const headX = topX + tiltX;
        const headY = topY + tiltY;

        // Tallo
        const ctrlX = baseX + Math.sin(sway * 0.6) * (stemHeight * 0.45) + tiltX * 0.35;
        const ctrlY = baseY - stemHeight * 0.5;

        ctx.strokeStyle = isNight ? "#235432" : "#458732";
        ctx.lineWidth = Math.max(8, 13 * scale);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.quadraticCurveTo(ctrlX, ctrlY, headX, headY);
        ctx.stroke();

        // Hojas
        drawLeaf(
          baseX + (headX - baseX) * 0.36,
          baseY + (headY - baseY) * 0.36,
          -0.42 + sway * 1.4,
          82 * scale,
          26 * scale,
          1
        );
        drawLeaf(
          baseX + (headX - baseX) * 0.56,
          baseY + (headY - baseY) * 0.56,
          0.38 + sway * 1.4,
          76 * scale,
          24 * scale,
          -1
        );

        // Resplandor detrás de la flor
        const glowRadius = (135 + pulse * 18) * scale;
        const aura = ctx.createRadialGradient(headX, headY, 12 * scale, headX, headY, glowRadius);
        if (isNight) {
          aura.addColorStop(0, "rgba(255, 206, 70, 0.26)");
          aura.addColorStop(1, "rgba(255, 206, 70, 0)");
        } else {
          aura.addColorStop(0, "rgba(255, 223, 94, 0.42)");
          aura.addColorStop(1, "rgba(255, 223, 94, 0)");
        }
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(headX, headY, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(headX, headY);
        const headScale = 1 + pulse * 0.06;
        ctx.scale(headScale, headScale);

        // Capa 1: Pétalos traseros (más largos y cálidos)
        const backCount = 24;
        for (let i = 0; i < backCount; i++) {
          const a = (Math.PI * 2 * i) / backCount + 0.12;
          const micro = Math.sin(time * 2.2 + i * 0.7) * 0.03;
          drawPetal(a, 92 * scale, 20 * scale, "#e88b10", "#ffd23f", micro);
        }

        // Capa 2: Pétalos medios
        const midCount = 20;
        for (let i = 0; i < midCount; i++) {
          const a = (Math.PI * 2 * i) / midCount;
          const micro = Math.cos(time * 2.5 + i * 0.9) * 0.025;
          drawPetal(a, 78 * scale, 18 * scale, "#f5a614", "#ffe45e", micro);
        }

        // Capa 3: Pétalos frontales
        const frontCount = 16;
        for (let i = 0; i < frontCount; i++) {
          const a = (Math.PI * 2 * i) / frontCount + 0.18;
          const micro = Math.sin(time * 2.8 + i) * 0.02;
          drawPetal(a, 62 * scale, 15 * scale, "#ffbe1a", "#fff08a", micro);
        }

        // Centro de semillas (espiral filotáctica)
        const diskRadius = 42 * scale;
        const diskGrad = ctx.createRadialGradient(0, 0, 4 * scale, 0, 0, diskRadius);
        diskGrad.addColorStop(0, "#4a2511");
        diskGrad.addColorStop(0.75, "#331708");
        diskGrad.addColorStop(1, "#1e0c03");

        ctx.fillStyle = diskGrad;
        ctx.beginPath();
        ctx.arc(0, 0, diskRadius, 0, Math.PI * 2);
        ctx.fill();

        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const seeds = 220;
        for (let n = 1; n <= seeds; n++) {
          const frac = n / seeds;
          const r = Math.sqrt(frac) * (diskRadius - 3.5 * scale);
          const theta = n * goldenAngle + time * 0.08;
          const sx = Math.cos(theta) * r;
          const sy = Math.sin(theta) * r;
          const sr = Math.max(1.1, (1.1 + frac * 1.4) * scale);

          ctx.fillStyle = frac > 0.65 ? "#8c4a19" : "#5e2e0d";
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();

        if (Math.random() < (breezeLevel === 2 ? 0.35 : 0.16)) {
          spawnAmbientPollen(headX, headY);
        }
      }

      function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx + Math.sin(time * 2 + i) * 0.25;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.sparkle ? "#fff380" : "#ffd147";
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function loop() {
        time += 0.016;
        pulse = Math.max(0, pulse - 0.035);

        ctx.clearRect(0, 0, width, height);
        drawBackground();
        drawSunflower();
        drawParticles();

        requestAnimationFrame(loop);
      }

      modeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        isNight = !isNight;
        scene.classList.toggle("is-night", isNight);
        modeBtn.textContent = isNight ? "Modo Día" : "Modo Noche";
      });

      breezeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        breezeLevel = (breezeLevel + 1) % 3;
        const labels = ["Brisa: Calma", "Brisa: Suave", "Brisa: Animada"];
        breezeBtn.textContent = labels[breezeLevel];
      });

      canvas.addEventListener("pointermove", (e) => {
        const rect = canvas.getBoundingClientRect();
        pointer.x = e.clientX - rect.left;
        pointer.y = e.clientY - rect.top;
        pointer.active = true;
      });

      canvas.addEventListener("pointerleave", () => {
        pointer.active = false;
      });

      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        pulse = 1;
        spawnBurst(x, y, 22);
      });

      window.addEventListener("resize", resize);
      resize();
      loop();
    })();
  </script>
</body>
</html>
